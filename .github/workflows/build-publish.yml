# Container image pipeline for SquadRules MCP.
#
# Builds the runtime image FROM the published @squadrules/mcp npm package (never from
# source), scans it, and — outside pull requests — signs and publishes it to Docker Hub
# and quay.io, then promotes channel aliases.
#
# Decoupling contract: this pipeline is the ONLY place image build/scan/sign/publish
# happens. An image/OS/library CVE here can never block an npm release or a code merge in
# SquadRules/mcp. The mcp release pipeline publishes npm only; this repo builds images
# independently via schedule (hourly npm poll), push (Dockerfile/trivyignore/release-please), workflow_dispatch, or pull_request.
#
# Triggers:
#   - schedule (hourly)                   — reconciliation against npm latest.
#   - push (main; mcp/Dockerfile, .trivyignore, .release-please-manifest.json,
#           CHANGELOG.md)                 — force-rebuild + republish when the
#                                           image recipe, scan gate, or release version changes.
#   - workflow_dispatch                   — manual build for an explicit version (or latest).
#   - pull_request                        — build + smoke-test + scan ONLY (no publish) on every
#                                           PR, so the "Container image pipeline passed" aggregate
#                                           always reports and can serve as a required branch-protection
#                                           check (a paths filter would strand non-image PRs on a
#                                           required check that never runs).
name: Container image pipeline

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '@squadrules/mcp version to build (empty = latest published on npm)'
        required: false
        default: ''
      force:
        description: Rebuild and republish even if the image tag already exists
        type: boolean
        default: false
      dry-run:
        description: Build and scan only; do not sign, publish, promote, or dispatch
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'mcp/Dockerfile'
      - '.trivyignore'
      - '.release-please-manifest.json'
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-image-pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACKAGE: '@squadrules/mcp'
  # Canonical public reference used for idempotency checks and smoke tests.
  DOCKER_IMAGE: docker.io/squadrules/mcp

jobs:
  resolve:
    name: Resolve target version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve version and publish intent
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
        run: |
          set -euo pipefail
          pkg="@squadrules/mcp"

          # Version precedence: workflow_dispatch input > npm latest.
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(npm view "$pkg" version)"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9-]+\.[0-9]+)?$'; then
            echo "::error::Resolved version '$version' is not a valid semver"; exit 1
          fi
          echo "Resolved target version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Publish only outside pull requests and not during a dry run.
          publish=true
          if [ "$EVENT_NAME" = "pull_request" ]; then publish=false; fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then publish=false; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

          # Idempotency: only the scheduled reconciliation poll skips when the canonical tag
          # exists in BOTH registries. Push events (Dockerfile/trivyignore changes) always
          # rebuild to ensure the image reflects the latest recipe. Checking docker.io alone
          # masked partial publishes: if docker.io succeeded but quay.io failed, every later
          # run skipped and quay.io never caught up.
          skip=false
          if [ "$EVENT_NAME" = "schedule" ] && [ "$publish" = "true" ] && [ "${INPUT_FORCE:-false}" != "true" ]; then
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y skopeo
            docker_ref="docker://docker.io/squadrules/mcp:${version}"
            quay_ref="docker://quay.io/${QUAY_NAMESPACE}/mcp:${version}"
            have_docker=false; have_quay=false
            if skopeo inspect --no-tags "${docker_ref}" >/dev/null 2>&1; then have_docker=true; fi
            if skopeo inspect --no-tags "${quay_ref}" >/dev/null 2>&1; then have_quay=true; fi
            if [ "$have_docker" = "true" ] && [ "$have_quay" = "true" ]; then
              echo "Image tag ${version} already published to docker.io and quay.io; skipping."
              skip=true
            elif [ "$have_docker" = "true" ]; then
              echo "::warning::Partial publish detected for ${version}: present on docker.io but missing on quay.io/${QUAY_NAMESPACE}/mcp — proceeding to retry the publish so quay.io catches up."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    name: Build, smoke-test and scan (linux/amd64 + linux/arm64)
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # The amd64 leg boots the full HTTP server and asserts /health (~40s natively). The
    # arm64 leg runs under QEMU on the x86 runner and skips the HTTP boot entirely — it
    # only verifies the per-arch native modules (onnxruntime-node, @lancedb/lancedb) load,
    # which is the actual packaging risk. With GHA layer caching the build step itself is
    # a few minutes on a warm cache, so the whole job comfortably fits inside 90 min.
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Install OCI transport
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y skopeo

      - name: Export GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Build immutable multi-platform OCI archive (from published npm)
        run: |
          set -euo pipefail
          mkdir -p .local
          # GHA layer cache: subsequent runs reuse the base-image, npm-install, and
          # model-bake layers across PRs and the daily reconciliation, so the incremental
          # build collapses to a few minutes. mode=max caches every stage, not just the
          # final one — the runtime stage inherits from an os-base stage whose layers are
          # the expensive part.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target runtime \
            --build-arg PACKAGE_VERSION="${VERSION}" \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --build-arg BUILD_SOURCE="https://github.com/${GITHUB_REPOSITORY}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --provenance=false --sbom=false \
            --output type=oci,dest=.local/image.oci.tar \
            -f mcp/Dockerfile mcp

      - name: Smoke-test both platforms (version, baked model, HTTP on amd64 / native modules on arm64)
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            skopeo copy --override-os linux --override-arch "${arch}" \
              oci-archive:.local/image.oci.tar \
              "docker-archive:.local/scan-${arch}.tar:squadrules-scan:${arch}"
            docker load --input ".local/scan-${arch}.tar"
            # scripts/ci-smoke-image.sh legs 1–2 (package version, baked embedding model)
            # run identically on both architectures. Leg 3 diverges per arch:
            #
            # amd64 — full HTTP boot + /health assertion: natively it lands in ~40s and
            # is the only leg that exercises the default env contract (baked
            # TRANSPORT_TYPE=http, embedded LanceDB backend, SIGTERM handling).
            #
            # arm64 — runs under QEMU on this x86 runner, where the same boot would spend
            # 45+ min on CPU-bound ONNX inference emulating boot-injection of every
            # bundled adapter before /health ever answers. What actually has to be true
            # on arm64 is that the per-arch native binaries (onnxruntime-node,
            # @lancedb/lancedb — npm optional platform deps) shipped a working arm64
            # build. SMOKE_SKIP_HEALTH=1 tells the script to prove exactly that with a
            # require() check instead, which finishes in seconds. The 600s deadline is
            # irrelevant on this leg but kept at the default so any future re-enable of
            # the HTTP boot fails fast on a hung native start rather than silently
            # burning the job budget.
            if [ "${arch}" = "arm64" ]; then
              export SMOKE_SKIP_HEALTH=1
              export SMOKE_CLUSTER_DEADLINE=600
            else
              unset SMOKE_SKIP_HEALTH || true
              export SMOKE_CLUSTER_DEADLINE=600
            fi
            ./scripts/ci-smoke-image.sh "squadrules-scan:${arch}" "${VERSION}" \
              --platform "linux/${arch}"
          done

      - name: Compute immutable image digest
        id: digest
        run: |
          set -euo pipefail
          digest="sha256:$(skopeo inspect --raw oci-archive:.local/image.oci.tar | sha256sum | cut -d' ' -f1)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Image digest: ${digest}"

      - name: Trivy scan amd64 (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: .local/scan-amd64.tar
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Trivy scan arm64 (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: .local/scan-arm64.tar
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      # SPDX SBOMs are build artifacts, not registry attachments: `skopeo copy --all
      # --preserve-digests` would change the published digest if attestations were pushed
      # with the image, and the pipeline's whole point is publishing the built digest.
      # Unfiltered (no severity limit, no .trivyignore, every package whether or not it has a
      # CVE) — an SBOM is an inventory, and a suppressed finding must stay visible in it.
      #
      # Why direct trivy CLI instead of trivy-action for the SBOM steps? trivy-action@v0.36.0
      # is a composite action that plumbs its `input:` / `output:` / `format:` inputs into
      # trivy by writing them to a `./trivy_envs.txt` shell-sourced file and then invoking
      # `trivy image <scan-ref-defaults-to-dot>`. For tarball scans the wrapper's env-file
      # indirection has proven unreliable: the step exits 0 but `TRIVY_OUTPUT` never reaches
      # the child trivy process, so no file lands in `.local/` and the `Upload SBOMs` glob
      # matches nothing. Calling trivy directly with explicit `--input` and `--output` paths
      # removes the indirection, and the `test -s` post-check turns a silent no-op into a
      # loud `::error::` in the same step.
      - name: Ensure .local/ exists for SBOM output
        run: mkdir -p .local

      - name: Install Trivy for direct SBOM generation
        # Same pin trivy-action@v0.36.0 uses internally, so this is a no-op when the
        # preceding trivy-action steps have already installed trivy, and an explicit
        # install when they haven't — the SBOM steps never depend on step ordering.
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: 'true'

      - name: Generate SPDX SBOM (amd64)
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -euo pipefail
          command -v trivy >/dev/null || { echo "::error::trivy is not on PATH"; exit 1; }
          out="${GITHUB_WORKSPACE}/.local/sbom-amd64.spdx.json"
          rm -f "${out}"
          trivy image \
            --input "${GITHUB_WORKSPACE}/.local/scan-amd64.tar" \
            --scanners vuln \
            --format spdx-json \
            --list-all-pkgs \
            --output "${out}"
          test -s "${out}" || { echo "::error::SBOM (amd64) was not written to ${out}"; exit 1; }
          echo "amd64 SBOM: $(wc -c < "${out}") bytes -> ${out}"

      - name: Generate SPDX SBOM (arm64)
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          set -euo pipefail
          command -v trivy >/dev/null || { echo "::error::trivy is not on PATH"; exit 1; }
          out="${GITHUB_WORKSPACE}/.local/sbom-arm64.spdx.json"
          rm -f "${out}"
          trivy image \
            --input "${GITHUB_WORKSPACE}/.local/scan-arm64.tar" \
            --scanners vuln \
            --format spdx-json \
            --list-all-pkgs \
            --output "${out}"
          test -s "${out}" || { echo "::error::SBOM (arm64) was not written to ${out}"; exit 1; }
          echo "arm64 SBOM: $(wc -c < "${out}") bytes -> ${out}"

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ needs.resolve.outputs.version }}
          # Kept at `error`: the preceding steps now verify the artifacts exist on disk
          # with `test -s`, so an empty glob here means the verification was bypassed,
          # not that trivy silently no-op'd. Fail loudly rather than publish a
          # release with missing SBOMs.
          if-no-files-found: error
          retention-days: 90
          # upload-artifact@v7 defaults include-hidden-files to false, which silently
          # drops anything under a dot-directory. SBOMs live in .local/, so without
          # this flag the glob matches nothing and if-no-files-found: error fails the
          # build even though the files are on disk.
          include-hidden-files: true
          path: .local/sbom-*.spdx.json

      - name: Persist digest for the publish job
        if: needs.resolve.outputs.publish == 'true'
        run: echo "${{ steps.digest.outputs.digest }}" > .local/digest.txt

      - name: Upload OCI image for publication
        if: needs.resolve.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-oci-${{ needs.resolve.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          # Same dot-directory trap as the SBOM upload: .local/image.oci.tar and
          # .local/digest.txt are invisible to upload-artifact@v7 unless hidden
          # files are explicitly included.
          include-hidden-files: true
          path: |
            .local/image.oci.tar
            .local/digest.txt

  publish:
    name: Sign, publish, promote and notify charts
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write # cosign keyless signing (Fulcio OIDC)
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE }}
      QUAY_IMAGE: quay.io/${{ vars.QUAY_NAMESPACE }}/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download OCI image
        uses: actions/download-artifact@v8
        with:
          name: image-oci-${{ needs.resolve.outputs.version }}
          path: .local

      - name: Install OCI transport + cosign
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y skopeo

      - uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to quay.io
        uses: docker/login-action@v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Publish immutable version to both registries, sign, then promote aliases
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          # Deliberately NOT `set -e` (and `set +e` cancels the errexit that GitHub's
          # default bash invocation adds): every command failure is handled explicitly so
          # that one registry cannot strand the other. Previously a single sequential loop
          # aborted the whole step on the first push failure, which left docker.io holding
          # the version tag with NO cosign signature and NO alias tags whenever quay.io
          # failed. Each registry is now an independent atomic publish, and the step still
          # exits non-zero at the end if any registry failed (branch protection preserved).
          set +e
          set -uo pipefail
          digest="$(cat .local/digest.txt)"
          authfile="${HOME}/.docker/config.json"
          targets="docker.io/squadrules/mcp ${QUAY_IMAGE}"

          # 0) Pre-flight probe. A quay.io robot token fails late and opaquely — a missing
          #    repository and a missing permission are indistinguishable from a push error.
          #    Warn before the loop so the failure is diagnosable; never abort here, because
          #    docker.io must still publish even when quay.io is unreachable.
          if ! curl -sf -u "${QUAY_USERNAME}:${QUAY_PASSWORD}" \
               "https://quay.io/v2/${QUAY_NAMESPACE}/mcp/tags/list" >/dev/null 2>&1; then
            echo "::warning::quay.io/${QUAY_NAMESPACE}/mcp is not reachable with robot credentials — ensure the repository exists and the robot has Read+Write permission"
          fi

          # Derive channel aliases (mirrors the application repo's channelTags()):
          #   stable X.Y.Z -> latest, X, X.Y ; prerelease X.Y.Z-<channel>.N -> <channel>.
          case "${VERSION}" in
            *-*)
              channel="$(printf '%s' "${VERSION}" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-([a-z0-9-]+)\.[0-9]+$/\1/')"
              tags="${channel}"
              ;;
            *)
              major="${VERSION%%.*}"; rest="${VERSION#*.}"; minor="${rest%%.*}"
              tags="latest ${major} ${major}.${minor}"
              ;;
          esac

          # Publish ONE registry end-to-end: push the immutable version tag (preserving the
          # built digest), sign and verify that digest, then promote the channel aliases.
          # Returns 0 only when the whole sequence succeeded for this target.
          publish_one() {
            local target="$1"
            local tag

            if ! skopeo copy --all --preserve-digests --authfile "${authfile}" \
              oci-archive:.local/image.oci.tar "docker://${target}:${VERSION}"; then
              echo "::error::Publish FAILED for ${target}:${VERSION} — immutable tag push did not complete"
              case "${target}" in
                quay.io/*)
                  echo "::error::quay.io push failed — verify robot token has write permission on ${QUAY_NAMESPACE}/mcp"
                  ;;
              esac
              return 1
            fi

            if ! cosign sign --yes "${target}@${digest}"; then
              echo "::error::Publish FAILED for ${target}@${digest} — cosign sign did not complete"
              return 1
            fi

            if ! cosign verify \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${target}@${digest}"; then
              echo "::error::Publish FAILED for ${target}@${digest} — cosign verify rejected the signature"
              return 1
            fi

            # Promote aliases by copying the immutable digest to each tag (idempotent).
            for tag in ${tags}; do
              if ! skopeo copy --all --preserve-digests --authfile "${authfile}" \
                "docker://${target}@${digest}" "docker://${target}:${tag}"; then
                echo "::error::Publish FAILED for ${target}:${tag} — alias promotion did not complete"
                return 1
              fi
            done

            echo "Published ${target}:${VERSION} (${digest}) signed, aliases: ${tags}"
            return 0
          }

          # 1) Publish each registry independently, recording — not aborting on — failure.
          failed_targets=""
          for target in ${targets}; do
            if publish_one "${target}"; then
              echo "::notice::Publish succeeded for ${target}:${VERSION} (signed, aliases promoted)"
            else
              failed_targets="${failed_targets} ${target}"
            fi
          done

          if [ -n "${failed_targets}" ]; then
            echo "::error::Publish incomplete for:${failed_targets} — the remaining registries were still attempted"
            exit 1
          fi

          echo "${digest}" > .local/published-digest.txt

      - name: Verify published tags resolve in both registries
        run: |
          set -euo pipefail
          authfile="${HOME}/.docker/config.json"
          docker_ref="docker://docker.io/squadrules/mcp:${VERSION}"
          quay_ref="docker://${QUAY_IMAGE}:${VERSION}"
          failed=false
          docker_digest="$(skopeo inspect --authfile "${authfile}" --format '{{.Digest}}' "${docker_ref}" 2>/dev/null)" \
            || { echo "::error::Publish verification failed for docker.io/squadrules/mcp:${VERSION}"; failed=true; }
          quay_digest="$(skopeo inspect --authfile "${authfile}" --format '{{.Digest}}' "${quay_ref}" 2>/dev/null)" \
            || { echo "::error::Publish verification failed for ${QUAY_IMAGE}:${VERSION}"; failed=true; }
          if [ "${failed}" = "true" ]; then exit 1; fi
          echo "Publish verified — docker.io/squadrules/mcp:${VERSION} digest ${docker_digest}; ${QUAY_IMAGE}:${VERSION} digest ${quay_digest}"

  image-pipeline-pass:
    name: Container image pipeline passed
    needs: [resolve, build, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require build (and publish when publishing)
        env:
          RESOLVE: ${{ needs.resolve.result }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
          PUBLISH_INTENT: ${{ needs.resolve.outputs.publish }}
          SKIP: ${{ needs.resolve.outputs.skip }}
        run: |
          set -euo pipefail
          echo "resolve=$RESOLVE build=$BUILD publish=$PUBLISH publish_intent=$PUBLISH_INTENT skip=$SKIP"
          test "$RESOLVE" = "success"
          # A skip (already published) is a successful no-op.
          if [ "$SKIP" = "true" ]; then
            echo "Pipeline skipped (image already published)."; exit 0
          fi
          test "$BUILD" = "success"
          if [ "$PUBLISH_INTENT" = "true" ]; then
            test "$PUBLISH" = "success"
          else
            echo "Pull-request / dry-run: publish skipped is expected (result=$PUBLISH)."
          fi
          echo "Container image pipeline passed."
